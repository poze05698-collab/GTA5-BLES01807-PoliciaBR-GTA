name: Build Policia BR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar estrutura
        shell: cmd
        run: |
          echo ===== PROJETO =====
          dir
          echo ===== ILlCiT =====
          dir illicit
          echo ===== VCXPROJ =====
          type illicit\illicit.vcxproj

      - name: Verificar compiladores
        shell: cmd
        run: |
          where msbuild || echo MSBuild nao encontrado
          where devenv || echo Visual Studio nao encontrado
          where ps3ppusnc || echo SNC nao encontrado
          where ps3ppuld || echo SN linker nao encontrado

      - name: Procurar SDK PS3
        shell: powershell
        run: |
          Write-Host "===== VARIAVEIS ====="
          Write-Host "SCE_PS3_ROOT = $env:SCE_PS3_ROOT"
          Write-Host "SN_PS3_PATH  = $env:SN_PS3_PATH"

          Write-Host "===== DIRETORIOS ====="

          if (Test-Path "C:\usr\local\cell") {
              Get-ChildItem "C:\usr\local\cell"
          }

          if (Test-Path "C:\Program Files\SCE") {
              Get-ChildItem "C:\Program Files\SCE"
          }

          if (Test-Path "C:\Program Files (x86)\SCE") {
              Get-ChildItem "C:\Program Files (x86)\SCE"
          }

      - name: Resultado
        shell: cmd
        run: |
          echo.
          echo ==========================================
          echo TESTE DE AMBIENTE CONCLUIDO
          echo ==========================================
